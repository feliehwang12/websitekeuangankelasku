<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Keuangan Kelasku</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* ── Donat Chart ─────────────────────────────────────── */
    .donat-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 1.5rem; flex-wrap: wrap; padding: .5rem 0;
    }
    .donat-svg-wrap { position: relative; flex-shrink: 0; }
    .donat-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .donat-center .pct  { font-size: 1.4rem; font-weight: 800; color: var(--gray-900); line-height: 1; }
    .donat-center .sub  { font-size: .7rem; color: var(--gray-500); font-weight: 500; margin-top: .15rem; }
    .donat-center .nom  { font-size: .72rem; font-weight: 700; margin-top: .1rem; }

    .donat-legend { list-style: none; display: flex; flex-direction: column; gap: .5rem; }
    .donat-legend li {
      display: flex; align-items: center; gap: .6rem;
      font-size: .8rem; color: var(--gray-700);
    }
    .donat-legend .dot {
      width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
    }
    .donat-legend .leg-nom { font-weight: 700; color: var(--gray-900); font-size: .82rem; }
    .donat-legend .leg-pct { font-size: .72rem; color: var(--gray-500); }

    .donat-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-bottom: 1.5rem;
    }
    @media(max-width:900px) { .donat-grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width:520px) { .donat-grid { grid-template-columns: 1fr; } }

    /* Dashboard-specific */
    .welcome-banner {
      background: linear-gradient(135deg, var(--emerald-700) 0%, var(--emerald-800) 60%, var(--emerald-900) 100%);
      border-radius: var(--radius-xl);
      padding: 1.75rem 2rem;
      margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; overflow: hidden; position: relative;
    }
    .welcome-banner::after {
      content: '💰';
      position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%);
      font-size: 5rem; opacity: .15;
    }
    .welcome-banner h2 { color: white; font-size: 1.4rem; margin-bottom: .3rem; }
    .welcome-banner p  { color: var(--emerald-200); font-size: .875rem; }
    .welcome-chip {
      background: rgba(255,255,255,.15); color: white;
      padding: .3rem .9rem; border-radius: var(--radius-full);
      font-size: .75rem; font-weight: 600; margin-top: .5rem; display: inline-block;
    }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    @media (max-width: 900px)  { .dashboard-grid { grid-template-columns: 1fr; } }

    /* Iuran summary card */
    .iuran-progress-list { list-style: none; }
    .iuran-progress-item {
      display: flex; align-items: center; gap: .75rem;
      padding: .6rem 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .iuran-progress-item:last-child { border-bottom: none; }
    .iuran-bulan { min-width: 100px; font-size: .82rem; font-weight: 600; color: var(--gray-700); }
    .iuran-bar   { flex: 1; }
    .iuran-pct   { min-width: 40px; text-align: right; font-size: .78rem; font-weight: 600; color: var(--emerald-600); }

    /* Recent transactions */
    .trx-item {
      display: flex; align-items: center; gap: .875rem;
      padding: .75rem 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .trx-item:last-child { border-bottom: none; }
    .trx-icon {
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: .875rem;
    }
    .trx-icon--masuk  { background: var(--emerald-50); }
    .trx-icon--keluar { background: #fef2f2; }
    .trx-info { flex: 1; min-width: 0; }
    .trx-info strong { display: block; font-size: .875rem; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trx-info span   { font-size: .75rem; color: var(--gray-500); }
    .trx-nominal { font-weight: 700; font-size: .875rem; white-space: nowrap; }
    .trx-nominal--masuk  { color: var(--emerald-600); }
    .trx-nominal--keluar { color: var(--red-500); }

    /* Kegiatan summary */
    .kegiatan-card-item {
      background: var(--gray-50); border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: .875rem 1rem;
      margin-bottom: .75rem;
    }
    .kegiatan-card-item:last-child { margin-bottom: 0; }
    .kegiatan-card-item h4 { font-size: .875rem; margin-bottom: .25rem; }
    .kegiatan-card-item p  { font-size: .78rem; color: var(--gray-500); margin-bottom: .5rem; }

    /* Saldo big */
    .saldo-display {
      text-align: center; padding: .5rem 0;
    }
    .saldo-display .label { font-size: .8rem; color: var(--gray-500); font-weight: 500; margin-bottom: .25rem; }
    .saldo-display .amount {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--emerald-600), var(--emerald-400));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .saldo-display .sub { font-size: .75rem; color: var(--gray-400); margin-top: .25rem; }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
      <header class="topbar" id="appTopbar"></header>
      <main class="page-content" id="pageContent">
        <!-- konten dirender oleh JS -->
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/public_config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    // ── Helper: render donat SVG ───────────────────────────────
    // segments: [{ nilai, warna, label }]
    // centerPct: teks besar di tengah
    // centerSub: teks kecil di tengah
    // centerNom: nominal di tengah
    function buatDonat(segments, centerPct, centerSub, centerNom, size = 140) {
      const total = segments.reduce((a, s) => a + s.nilai, 0);
      if (total === 0) {
        return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${size/2 - 16}" fill="none" stroke="#e5e7eb" stroke-width="22"/>
        </svg>`;
      }

      const cx = size / 2, cy = size / 2;
      const r  = size / 2 - 16;
      const circumference = 2 * Math.PI * r;
      let offset = 0;
      // Mulai dari atas (−90°)
      let paths = '';

      segments.forEach((seg, i) => {
        const pct  = seg.nilai / total;
        const dash = pct * circumference;
        const gap  = circumference - dash;
        const rotate = offset * 360 - 90;
        paths += `<circle
          cx="${cx}" cy="${cy}" r="${r}"
          fill="none"
          stroke="${seg.warna}"
          stroke-width="22"
          stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
          stroke-dashoffset="${(circumference * (1 - offset) - circumference).toFixed(2)}"
          transform="rotate(${rotate.toFixed(2)} ${cx} ${cy})"
          stroke-linecap="round"
          style="transition: stroke-dasharray .6s ease"
        />`;
        offset += pct;
      });

      const nomColor = centerNom && centerNom.startsWith('+') ? '#2563eb'
                     : centerNom && centerNom.startsWith('-') ? '#ef4444' : '#1e293b';

      return `
        <div class="donat-svg-wrap">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3f4f6" stroke-width="22"/>
            ${paths}
          </svg>
          <div class="donat-center">
            <span class="pct">${centerPct}</span>
            <span class="sub">${centerSub}</span>
            ${centerNom ? `<span class="nom" style="color:${nomColor}">${centerNom}</span>` : ''}
          </div>
        </div>`;
    }

    function buatLegend(segments, total) {
      return `<ul class="donat-legend">
        ${segments.map(s => {
          const pct = total > 0 ? Math.round(s.nilai / total * 100) : 0;
          return `<li>
            <span class="dot" style="background:${s.warna}"></span>
            <div>
              <div>${s.label}</div>
              <div class="leg-nom">${Utils.rupiah(s.nilai)}</div>
              <div class="leg-pct">${pct}% dari total</div>
            </div>
          </li>`;
        }).join('')}
      </ul>`;
    }

    // Tunggu auth & sinkron sesi selesai, baru render konten
    Layout.init('dashboard').then((ok) => {
      if (ok) renderDashboard();
    });

    function renderDashboard() {
      const sesi   = DB.getSesi();
      const saldo  = DB.getSaldo();
      const masuk  = DB.getTotalMasuk();
      const keluar = DB.getTotalKeluar();
      const iuran  = DB.getIuran();
      const siswa  = DB.getSiswa().filter(s => s.role === 'siswa' && s.aktif);
      const bulanList = DB.getBulanIuran();
      const trxList   = [...DB.getTransaksi()].sort((a,b) => new Date(b.tgl) - new Date(a.tgl)).slice(0, 5);
      const kegiatan  = DB.getKegiatan();

      // Iuran bulan ini
      const bulanIni = new Date().toISOString().slice(0, 7);
      const iuranBulanIni = iuran.filter(i => i.bulan === bulanIni);
      const lunasBulanIni = iuranBulanIni.filter(i => i.status === 'lunas').length;

      // Iuran per bulan progress
      const iuranProgressHTML = bulanList.slice(-5).reverse().map(bln => {
        const total  = iuran.filter(i => i.bulan === bln).length;
        const lunas  = iuran.filter(i => i.bulan === bln && i.status === 'lunas').length;
        const pct    = total ? Math.round(lunas / total * 100) : 0;
        return `
          <li class="iuran-progress-item">
            <span class="iuran-bulan">${Utils.bulanIndo(bln)}</span>
            <div class="iuran-bar">
              <div class="progress">
                <div class="progress-bar" style="width:${pct}%"></div>
              </div>
            </div>
            <span class="iuran-pct">${pct}%</span>
          </li>`;
      }).join('');

      // Recent transactions
      const trxHTML = trxList.length === 0
        ? `<div class="empty-state"><div class="empty-icon">📭</div><p>Belum ada transaksi</p></div>`
        : trxList.map(t => `
          <div class="trx-item">
            <div class="trx-icon trx-icon--${t.jenis}">${t.jenis === 'masuk' ? '⬆️' : '⬇️'}</div>
            <div class="trx-info">
              <strong>${t.keterangan}</strong>
              <span>${Utils.tglIndo(t.tgl)} · ${t.kategori}</span>
            </div>
            <span class="trx-nominal trx-nominal--${t.jenis}">
              ${t.jenis === 'masuk' ? '+' : '-'}${Utils.rupiah(t.nominal)}
            </span>
          </div>`).join('');

      // Kegiatan cards
      const kgHTML = kegiatan.length === 0
        ? `<div class="empty-state"><div class="empty-icon">🏊</div><p>Belum ada kegiatan</p></div>`
        : kegiatan.slice(0, 3).map(kg => {
            const bayar  = DB.getKgBayar(kg.id);
            const total  = siswa.length;
            const lunas  = Object.values(bayar).filter(b => b.status === 'lunas').length;
            const pct    = total ? Math.round(lunas / total * 100) : 0;
            return `
              <div class="kegiatan-card-item">
                <div class="flex-between">
                  <h4>🎯 ${kg.nama}</h4>
                  <span class="badge badge--info">${Utils.rupiah(kg.nominal)}</span>
                </div>
                <p>${Utils.tglIndo(kg.tgl)}</p>
                <div class="flex" style="gap:.5rem;align-items:center;">
                  <div class="progress" style="flex:1">
                    <div class="progress-bar" style="width:${pct}%"></div>
                  </div>
                  <span class="text-sm fw-600 text-green">${lunas}/${total}</span>
                </div>
              </div>`;
          }).join('');

      // Iuran siswa sendiri (jika bukan bendahara)
      let myIuranHTML = '';
      if (sesi.role === 'siswa') {
        const myIuran = DB.getIuranSiswa(sesi.siswaId).slice(-3).reverse();
        myIuranHTML = `
          <div class="card mt-4">
            <div class="card-header">
              <h3>📅 Iuranku</h3>
              <a href="kas.html" class="btn btn-sm btn-outline">Lihat Semua</a>
            </div>
            <div class="card-body">
              ${myIuran.length === 0 ? '<div class="empty-state"><p>Belum ada data iuran</p></div>'
              : `<table class="table">
                  <thead><tr><th>Bulan</th><th>Nominal</th><th>Status</th><th>Tgl Bayar</th></tr></thead>
                  <tbody>
                  ${myIuran.map(i => `
                    <tr>
                      <td data-label="Bulan">${Utils.bulanIndo(i.bulan)}</td>
                      <td data-label="Nominal">${Utils.rupiah(i.nominal)}</td>
                      <td data-label="Status"><span class="badge ${Utils.badgeStatus(i.status)}">${i.status === 'lunas' ? '✓ Lunas' : '⏳ Belum'}</span></td>
                      <td data-label="Tgl Bayar">${Utils.tglIndo(i.tglBayar)}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>`}
            </div>
          </div>`;
      }

      document.getElementById('pageContent').innerHTML = `
        <!-- Welcome banner -->
        <div class="welcome-banner">
          <div>
            <h2>Halo, ${sesi.nama.split(' ')[0]}! 👋</h2>
            <p>Sistem Pengelolaan Kas Kelas Digital</p>
            <span class="welcome-chip">${sesi.role === 'bendahara' ? '💼 Mode Bendahara' : '🎓 Mode Siswa'}</span>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="stat-grid">
          <div class="stat-card stat-card--green">
            <div class="stat-icon stat-icon--green">💰</div>
            <div class="stat-info">
              <p>Saldo Kas</p>
              <h3>${Utils.rupiah(saldo)}</h3>
              <span>Kas kelas saat ini</span>
            </div>
          </div>
          <div class="stat-card stat-card--gold">
            <div class="stat-icon stat-icon--gold">📈</div>
            <div class="stat-info">
              <p>Total Pemasukan</p>
              <h3>${Utils.rupiah(masuk)}</h3>
              <span>Semua transaksi masuk</span>
            </div>
          </div>
          <div class="stat-card stat-card--red">
            <div class="stat-icon stat-icon--red">📉</div>
            <div class="stat-info">
              <p>Total Pengeluaran</p>
              <h3>${Utils.rupiah(keluar)}</h3>
              <span>Semua transaksi keluar</span>
            </div>
          </div>
          <div class="stat-card stat-card--blue">
            <div class="stat-icon stat-icon--blue">✅</div>
            <div class="stat-info">
              <p>Iuran Bulan Ini</p>
              <h3>${lunasBulanIni} / ${siswa.length}</h3>
              <span>Siswa sudah lunas</span>
            </div>
          </div>
        </div>

        <!-- ── Donat Charts ── -->
        <div class="donat-grid" id="donatGrid"></div>

        <!-- Dashboard grid -->
        <div class="dashboard-grid">
          <!-- Iuran progress -->
          <div class="card">
            <div class="card-header">
              <h3>📊 Rekap Iuran Bulanan</h3>
              <a href="kas.html" class="btn btn-sm btn-outline">Detail</a>
            </div>
            <div class="card-body">
              ${bulanList.length === 0
                ? '<div class="empty-state"><div class="empty-icon">📅</div><p>Belum ada data iuran</p></div>'
                : `<ul class="iuran-progress-list">${iuranProgressHTML}</ul>`}
            </div>
          </div>

          <!-- Recent transactions -->
          <div class="card">
            <div class="card-header">
              <h3>🕐 Transaksi Terbaru</h3>
              <a href="laporan.html" class="btn btn-sm btn-outline">Semua</a>
            </div>
            <div class="card-body">${trxHTML}</div>
          </div>

          <!-- Kegiatan -->
          <div class="card">
            <div class="card-header">
              <h3>🏊 Uang Kegiatan</h3>
              <a href="kegiatan.html" class="btn btn-sm btn-outline">Detail</a>
            </div>
            <div class="card-body">${kgHTML}</div>
          </div>

          <!-- Jumlah siswa -->
          <div class="card">
            <div class="card-header">
              <h3>👥 Ringkasan Kelas</h3>
              <a href="siswa.html" class="btn btn-sm btn-outline">Data Siswa</a>
            </div>
            <div class="card-body">
              <div class="saldo-display">
                <div class="label">Total Siswa Aktif</div>
                <div class="amount">${siswa.length}</div>
                <div class="sub">Siswa terdaftar di kelas</div>
              </div>
              <hr class="divider" />
              <div class="flex-between text-sm" style="padding:.25rem 0">
                <span>Jumlah Bendahara</span><strong>1 orang</strong>
              </div>
              <div class="flex-between text-sm" style="padding:.25rem 0">
                <span>Kegiatan berjalan</span><strong>${kegiatan.length} kegiatan</strong>
              </div>
              <div class="flex-between text-sm" style="padding:.25rem 0">
                <span>Total transaksi</span><strong>${DB.getTransaksi().length} entri</strong>
              </div>
            </div>
          </div>
        </div>

        ${myIuranHTML}
      `;

      // ── Render donat charts setelah HTML ter-inject ────────
      renderDonatCharts(saldo, masuk, keluar, iuran, siswa, kegiatan);
    }

    function renderDonatCharts(saldo, masuk, keluar, iuranAll, siswa, kegiatan) {
      const grid = document.getElementById('donatGrid');
      if (!grid) return;

      // 1. Donat Kas: Masuk vs Keluar
      const segKas = [
        { nilai: masuk,  warna: '#059669', label: 'Pemasukan' },
        { nilai: keluar, warna: '#ef4444', label: 'Pengeluaran' },
      ];
      const totalKas = masuk + keluar;
      const pctMasuk = totalKas > 0 ? Math.round(masuk / totalKas * 100) : 0;

      // 2. Donat Iuran: Lunas vs Belum
      const lunasCount = iuranAll.filter(i => i.status === 'lunas').length;
      const belumCount = iuranAll.filter(i => i.status === 'belum').length;
      const totalIuran = lunasCount + belumCount;
      const nominalLunas = iuranAll.filter(i => i.status === 'lunas').reduce((a, i) => a + i.nominal, 0);
      const nominalBelum = iuranAll.filter(i => i.status === 'belum').reduce((a, i) => a + i.nominal, 0);
      const segIuran = [
        { nilai: lunasCount, warna: '#2563eb', label: 'Iuran Lunas' },
        { nilai: belumCount, warna: '#fbbf24', label: 'Belum Bayar' },
      ];
      const pctIuran = totalIuran > 0 ? Math.round(lunasCount / totalIuran * 100) : 0;

      // 3. Donat Kegiatan gabungan
      let kgLunas = 0, kgBelum = 0, kgNomLunas = 0;
      kegiatan.forEach(kg => {
        const bayar = DB.getKgBayar(kg.id);
        siswa.forEach(s => {
          const st = bayar[s.id]?.status || 'belum';
          if (st === 'lunas') { kgLunas++; kgNomLunas += kg.nominal; }
          else kgBelum++;
        });
      });
      const totalKg = kgLunas + kgBelum;
      const pctKg   = totalKg > 0 ? Math.round(kgLunas / totalKg * 100) : 0;
      const segKg   = [
        { nilai: kgLunas, warna: '#3b82f6', label: 'Sudah Bayar' },
        { nilai: kgBelum, warna: '#e5e7eb', label: 'Belum Bayar' },
      ];

      grid.innerHTML = `
        <!-- Donat 1: Kas -->
        <div class="card">
          <div class="card-header"><h3>💰 Komposisi Kas</h3></div>
          <div class="card-body">
            <div class="donat-wrap">
              ${buatDonat(segKas, pctMasuk + '%', 'Pemasukan', '+' + Utils.rupiah(masuk))}
              ${buatLegend(segKas, totalKas)}
            </div>
            <div style="margin-top:.875rem;padding-top:.875rem;border-top:1px solid var(--gray-100);text-align:center">
              <span style="font-size:.8rem;color:var(--gray-500)">Saldo bersih: </span>
              <span style="font-weight:800;font-size:1rem;color:var(--emerald-600)">${Utils.rupiah(saldo)}</span>
            </div>
          </div>
        </div>

        <!-- Donat 2: Iuran -->
        <div class="card">
          <div class="card-header"><h3>📅 Iuran Siswa</h3></div>
          <div class="card-body">
            <div class="donat-wrap">
              ${buatDonat(segIuran, pctIuran + '%', 'Lunas', '+' + Utils.rupiah(nominalLunas))}
              ${buatLegend([
                { nilai: nominalLunas, warna: '#2563eb', label: `Lunas (${lunasCount} siswa)` },
                { nilai: nominalBelum, warna: '#fbbf24', label: `Belum (${belumCount} siswa)` },
              ], nominalLunas + nominalBelum)}
            </div>
            <div style="margin-top:.875rem;padding-top:.875rem;border-top:1px solid var(--gray-100);text-align:center">
              <span style="font-size:.8rem;color:var(--gray-500)">Belum terkumpul: </span>
              <span style="font-weight:800;font-size:1rem;color:var(--gold-600)">${Utils.rupiah(nominalBelum)}</span>
            </div>
          </div>
        </div>

        <!-- Donat 3: Kegiatan -->
        <div class="card">
          <div class="card-header"><h3>🏊 Uang Kegiatan</h3></div>
          <div class="card-body">
            ${totalKg === 0
              ? '<div class="empty-state"><div class="empty-icon">🏊</div><p>Belum ada data kegiatan</p></div>'
              : `<div class="donat-wrap">
                  ${buatDonat(segKg, pctKg + '%', 'Terbayar', '+' + Utils.rupiah(kgNomLunas))}
                  ${buatLegend([
                    { nilai: kgLunas, warna: '#3b82f6', label: `Sudah Bayar (${kgLunas})` },
                    { nilai: kgBelum, warna: '#e5e7eb', label: `Belum Bayar (${kgBelum})` },
                  ], totalKg)}
                </div>
                <div style="margin-top:.875rem;padding-top:.875rem;border-top:1px solid var(--gray-100);text-align:center">
                  <span style="font-size:.8rem;color:var(--gray-500)">Total terkumpul: </span>
                  <span style="font-weight:800;font-size:1rem;color:var(--blue-500)">${Utils.rupiah(kgNomLunas)}</span>
                </div>`
            }
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
