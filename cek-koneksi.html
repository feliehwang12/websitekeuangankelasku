<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cek Koneksi Supabase — Keuangan Kelasku</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { padding: 2rem 1rem; }
    .diag { max-width: 720px; margin: 0 auto; }
    .diag-item {
      display: flex; align-items: flex-start; gap: .875rem;
      padding: 1rem; border-radius: var(--radius);
      background: white; box-shadow: var(--shadow); margin-bottom: .75rem;
    }
    .diag-icon { font-size: 1.25rem; flex-shrink: 0; }
    .diag-info { flex: 1; }
    .diag-info strong { display: block; margin-bottom: .2rem; }
    .diag-info span   { font-size: .82rem; color: var(--gray-500); word-break: break-word; }
    .status-ok   { color: var(--emerald-600); }
    .status-fail { color: var(--red-600); }
    .status-wait { color: var(--gray-400); }
  </style>
</head>
<body>
  <div class="diag">
    <div class="card" style="margin-bottom:1.5rem">
      <div class="card-header"><h3>🔍 Diagnostik Integrasi Supabase</h3></div>
      <div class="card-body">
        <p class="text-sm text-muted">Halaman ini menguji apakah koneksi ke Supabase berhasil. Buka lewat server lokal (bukan file://).</p>
      </div>
    </div>
    <div id="hasil"></div>

    <!-- Alat diagnosa akun -->
    <div class="card" style="margin-top:1.5rem">
      <div class="card-header"><h3>🧪 Cek Role & Kelas Akun</h3></div>
      <div class="card-body">
        <p class="text-sm text-muted mb-4">Masukkan email & password akun untuk melihat role & kelas yang TERSIMPAN di database.</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="diagEmail" class="form-control" placeholder="email@kamu.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="diagPwd" class="form-control" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary w-full" id="btnDiag">Cek Akun Ini</button>
        <div id="diagHasil" style="margin-top:1rem"></div>
      </div>
    </div>

    <div style="text-align:center;margin-top:1.5rem">
      <a href="index.html" class="btn btn-primary">← Kembali ke Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/public_config.js"></script>
  <script>
    const hasil = document.getElementById('hasil');
    function tambah(icon, judul, detail, status) {
      const cls = status === 'ok' ? 'status-ok' : status === 'fail' ? 'status-fail' : 'status-wait';
      hasil.innerHTML += `
        <div class="diag-item">
          <span class="diag-icon ${cls}">${icon}</span>
          <div class="diag-info">
            <strong class="${cls}">${judul}</strong>
            <span>${detail}</span>
          </div>
        </div>`;
    }

    (async () => {
      // 1. Cek config terisi
      if (!SUPABASE_URL || SUPABASE_URL.includes('GANTI') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('GANTI')) {
        tambah('❌', 'Config belum diisi', 'SUPABASE_URL atau SUPABASE_ANON_KEY masih placeholder di public_config.js', 'fail');
        return;
      }
      tambah('✅', 'Config terisi', `URL: ${SUPABASE_URL}`, 'ok');

      // 2. Cek library Supabase
      if (typeof supabase === 'undefined' || !supabase.createClient) {
        tambah('❌', 'Library Supabase gagal dimuat', 'Periksa koneksi internet / CDN', 'fail');
        return;
      }
      tambah('✅', 'Library Supabase dimuat', 'supabase-js v2 OK', 'ok');

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // 3. Tes query ke tabel profiles (tanpa login — harus kena RLS, 0 baris itu normal)
      try {
        const { data, error } = await client.from('profiles').select('id').limit(1);
        if (error) {
          tambah('⚠️', 'Query profiles error', error.message + ' (ini bisa normal jika RLS memblokir akses anonim)', 'wait');
        } else {
          tambah('✅', 'Koneksi database OK', `Tabel "profiles" bisa diakses. Baris terbaca: ${data.length} (0 itu normal karena belum login)`, 'ok');
        }
      } catch (e) {
        tambah('❌', 'Gagal konek database', e.message, 'fail');
      }

      // 4. Tes endpoint auth
      try {
        const { data, error } = await client.auth.getSession();
        tambah('✅', 'Endpoint Auth aktif', 'Supabase Auth siap menerima login & register', 'ok');
      } catch (e) {
        tambah('❌', 'Endpoint Auth gagal', e.message, 'fail');
      }

      tambah('🎉', 'Diagnostik selesai', 'Jika semua ✅, integrasi backend Anda SUKSES. Silakan coba daftar & login.', 'ok');
    })();

    // ── Alat diagnosa akun ──────────────────────────────────────
    document.getElementById('btnDiag').addEventListener('click', async () => {
      const email = document.getElementById('diagEmail').value.trim();
      const pwd   = document.getElementById('diagPwd').value;
      const box   = document.getElementById('diagHasil');
      box.innerHTML = '<p class="text-sm text-muted">Memeriksa...</p>';

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Login
      const { data: authData, error: authErr } = await client.auth.signInWithPassword({
        email: email.toLowerCase(), password: pwd,
      });
      if (authErr) {
        box.innerHTML = `<div class="diag-item"><span class="diag-icon status-fail">❌</span>
          <div class="diag-info"><strong class="status-fail">Login gagal</strong><span>${authErr.message}</span></div></div>`;
        return;
      }

      // Ambil profil
      const { data: profil, error: pErr } = await client
        .from('profiles').select('nama, role, kelas, email').eq('id', authData.user.id).single();

      if (pErr || !profil) {
        box.innerHTML = `<div class="diag-item"><span class="diag-icon status-fail">❌</span>
          <div class="diag-info"><strong class="status-fail">Profil tidak ditemukan</strong>
          <span>${pErr?.message || 'Baris profil belum dibuat. Trigger mungkin belum jalan — pastikan schema.sql sudah di-run ulang.'}</span></div></div>`;
        await client.auth.signOut();
        return;
      }

      const roleWarna = profil.role === 'bendahara' ? 'status-ok' : 'status-wait';
      box.innerHTML = `
        <div class="diag-item"><span class="diag-icon ${roleWarna}">${profil.role === 'bendahara' ? '💼' : '🎓'}</span>
          <div class="diag-info">
            <strong class="${roleWarna}">Role tersimpan: ${profil.role.toUpperCase()}</strong>
            <span>Nama: ${profil.nama}<br>Kelas: ${profil.kelas}<br>Email: ${profil.email}</span>
          </div>
        </div>
        ${profil.role !== 'bendahara' ? `<div class="diag-item"><span class="diag-icon status-wait">💡</span>
          <div class="diag-info"><strong>Akun ini terdaftar sebagai SISWA</strong>
          <span>Artinya kode bendahara saat daftar tidak cocok dengan kode di schema.sql (saat ini: <code>b3nd4h4r4</code>), ATAU schema.sql versi terbaru belum di-run. Daftar ulang dengan email baru + kode yang tepat, atau ubah role via SQL Editor (lihat instruksi di chat).</span></div></div>` : ''}
      `;
      await client.auth.signOut();
    });
  </script>
</body>
</html>
