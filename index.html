<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Keuangan Kelasku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">💰</div>
        <h1>Keuangan Kelasku</h1>
        <p>Sistem Pengelolaan Kas Kelas Digital</p>
      </div>

      <!-- Body -->
      <div class="login-body">

        <!-- Alert box -->
        <div class="login-error" id="alertBox">
          <span id="alertIcon">⚠</span>
          <span id="alertMsg"></span>
        </div>

        <!-- ── Form Login ────────────────────────────── -->
        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="inputEmail">Email <span class="required">*</span></label>
            <div class="login-input-wrap">
              <span class="login-input-icon">✉️</span>
              <input type="email" id="inputEmail" class="form-control"
                placeholder="email@kamu.com"
                maxlength="100" required autofocus />
            </div>
          </div>

          <div class="form-group">
            <label for="inputPassword">Password <span class="required">*</span></label>
            <div class="login-input-wrap">
              <span class="login-input-icon">🔒</span>
              <input type="password" id="inputPassword" class="form-control"
                placeholder="••••••••" minlength="6" required />
              <button type="button" class="login-input-toggle" id="togglePwd" aria-label="Tampilkan password">👁</button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            <div class="spinner"></div>
            <span>Masuk</span>
          </button>
        </form>

        <div style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--gray-500)">
          Belum punya akun?
          <a href="register.html" style="color:var(--emerald-600);font-weight:600;text-decoration:none">Daftar sekarang</a>
        </div>

      </div>

      <div class="login-footer">
        &copy; 2025 Keuangan Kelasku &bull; Versi 2.0
      </div>
    </div>
  </div>

  <!-- Supabase JS CDN (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Config publik (URL + anon key) -->
  <script src="js/config.js"></script>
  <!-- Data layer (localStorage fallback) -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <!-- Auth module -->
  <script src="js/auth.js"></script>

  <script>
    // Cek jika sudah ada sesi aktif → langsung ke dashboard
    (async () => {
      const session = await Auth.getSession();
      if (session) {
        window.location.href = 'pages/dashboard.html';
      }
    })();

    // Toggle show/hide password
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('inputPassword');
      const isText = pwd.type === 'text';
      pwd.type = isText ? 'password' : 'text';
      this.textContent = isText ? '👁' : '🙈';
    });

    function showAlert(msg, tipe = 'error') {
      const box  = document.getElementById('alertBox');
      const icon = document.getElementById('alertIcon');
      const txt  = document.getElementById('alertMsg');
      icon.textContent = tipe === 'error' ? '⚠' : '✓';
      txt.textContent  = msg;
      box.style.background  = tipe === 'error' ? '#fee2e2' : '#d1fae5';
      box.style.borderColor = tipe === 'error' ? '#fca5a5' : '#6ee7b7';
      box.style.color       = tipe === 'error' ? '#dc2626' : '#065f46';
      box.classList.add('show');
    }
    function hideAlert() {
      document.getElementById('alertBox').classList.remove('show');
    }

    // ── Submit Login ──────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideAlert();

      const email    = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value;
      const btn      = document.getElementById('btnLogin');

      btn.classList.add('loading');
      btn.disabled = true;

      const { data, error } = await Auth.signIn({ email, password });

      btn.classList.remove('loading');
      btn.disabled = false;

      if (error) {
        let pesan = 'Login gagal. Periksa email dan password Anda.';
        if (error.message?.includes('Invalid login')) pesan = 'Email atau password salah.';
        if (error.message?.includes('Email not confirmed')) pesan = 'Email belum dikonfirmasi. Periksa inbox Anda.';
        if (error.message?.includes('Failed to fetch') || error.message?.includes('NetworkError')) {
          pesan = 'Gagal terhubung ke server. Periksa koneksi internet Anda.';
        }
        showAlert(pesan);
        return;
      }

      window.location.href = 'pages/dashboard.html';
    });
  </script>
</body>
</html>
